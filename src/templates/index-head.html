<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Daily — Index</title>
  <style>
    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --surface2: #22263a;
      --border: #2e3348;
      --text: #e2e5f0;
      --muted: #7c82a0;
      --accent: #7b6ef6;
      --accent2: #56cfb2;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      font-size: 15px;
      line-height: 1.65;
      max-width: 800px;
      margin: 0 auto;
      padding: 48px 24px 80px;
    }
    a { color: var(--accent2); text-decoration: none; border-bottom: 1px solid transparent; transition: border-color 0.15s; }
    a:hover { border-bottom-color: var(--accent2); }

    header { margin-bottom: 48px; }
    header .label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.14em; color: var(--muted); margin-bottom: 8px; }
    header h1 { font-size: 30px; font-weight: 700; }
    header p { margin-top: 10px; color: var(--muted); font-size: 14px; max-width: 560px; }

    h2 { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); margin-bottom: 16px; margin-top: 40px; }

    /* Day card */
    .day-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 22px 24px;
      margin-bottom: 16px;
      display: block;
      color: var(--text);
      text-decoration: none;
      border-bottom: none;
      transition: border-color 0.15s, background 0.15s;
    }
    .day-card:hover { border-color: var(--accent); background: var(--surface2); }
    .day-card-header { display: flex; align-items: baseline; gap: 12px; margin-bottom: 14px; }
    .day-card-date { font-size: 18px; font-weight: 700; color: var(--text); }
    .day-card-count { font-size: 12px; color: var(--muted); }

    /* Highlights inside day card */
    .highlights { display: flex; flex-direction: column; gap: 8px; }
    .highlight { display: flex; gap: 10px; align-items: flex-start; }
    .highlight-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); margin-top: 7px; flex-shrink: 0; }
    .highlight-text { font-size: 13px; color: #b0b6cc; line-height: 1.5; }
    .highlight-source { font-size: 11px; color: var(--muted); margin-left: 4px; }

    .day-card-footer { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--border); font-size: 12px; color: var(--accent); font-weight: 500; }

    footer { margin-top: 60px; font-size: 12px; color: var(--muted); border-top: 1px solid var(--border); padding-top: 20px; }
  </style>
</head>
<body>

<nav class="site-nav" style="margin-bottom:32px;">
  <a href="index.html" style="color:var(--text);font-weight:600;font-size:13px;border:none;">Briefs</a>
  <a href="topics.html" style="color:var(--muted);font-size:13px;border:none;">Topics</a>
  <a href="archive.html" style="color:var(--muted);font-size:13px;border:none;">Archive</a>
</nav>

<header>
  <div class="label">My AI Daily</div>
  <h1>Daily Briefs</h1>
  <p>Daily scans of Anthropic, OpenAI, Google, AWS, Microsoft, practitioners, and community sources.</p>
</header>
